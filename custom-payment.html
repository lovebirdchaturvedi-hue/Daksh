<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institutional Custom Payment | APD Global Trade</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #d4af37; 
            --dark: #020617; 
            --glow: rgba(212, 175, 55, 0.4);
        }
        
        * { box-sizing: border-box; }
        
        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #020617 0%, #0f172a 100%); 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            overflow-x: hidden; 
            position: relative;
        }

        /* Animated Background Particles */
        .bg-particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(212, 175, 55, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(212, 175, 55, 0.08) 0%, transparent 50%);
            animation: pulse-bg 10s infinite alternate;
        }

        @keyframes pulse-bg {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .payment-card {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 50px 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
            text-align: center;
            position: relative;
            z-index: 10;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: float-in 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .payment-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 40px 80px rgba(0,0,0,0.9), 0 0 40px rgba(212,175,55,0.1);
            border-color: rgba(212, 175, 55, 0.4);
        }

        @keyframes float-in {
            0% { opacity: 0; transform: translateY(40px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo-icon {
            width: 60px; height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #020617, #1a1a1a);
            border: 2px solid var(--gold);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }
        .logo-icon span {
            font-family: 'Playfair Display', serif;
            font-size: 22px; font-weight: 900; color: var(--gold);
        }

        h1 { 
            font-family: 'Playfair Display', serif; 
            font-size: 2rem; 
            margin: 0 0 10px 0; 
            background: linear-gradient(90deg, #fff, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.subtitle { color: #94a3b8; font-size: 0.95rem; margin-bottom: 30px; line-height: 1.5; }

        .discount-badge {
            background: linear-gradient(135deg, rgba(34,197,94,0.1), rgba(6,95,70,0.4));
            border: 1px solid #22c55e;
            color: #4ade80;
            padding: 8px 15px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(34,197,94,0.2);
            animation: pulse-badge 2s infinite;
        }

        @keyframes pulse-badge {
            0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
            70% { box-shadow: 0 0 0 10px rgba(34,197,94,0); }
            100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
        }

        .input-group { text-align: left; margin-bottom: 25px; position: relative; }
        
        label { 
            display: block; font-size: 11px; text-transform: uppercase; 
            letter-spacing: 1.5px; color: #94a3b8; margin-bottom: 8px; font-weight: 800; 
        }
        
        input {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 16px 20px;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }
        
        input:focus { 
            border-color: var(--gold); 
            background: rgba(212, 175, 55, 0.05); 
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        .currency-tag { 
            position: absolute; right: 20px; top: 40px; 
            color: var(--gold); font-weight: 800; font-size: 0.9rem; 
        }

        .btn {
            width: 100%;
            padding: 18px;
            border-radius: 50px;
            border: none;
            font-weight: 800;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
            overflow: hidden;
        }
        
        .btn-phonepe { 
            background: linear-gradient(135deg, var(--gold), #8B6508); 
            color: #000; 
            box-shadow: 0 10px 25px rgba(212,175,55,0.3), inset 0 2px 5px rgba(255,255,255,0.4);
        }
        
        .btn-phonepe:hover { 
            transform: translateY(-3px) scale(1.02); 
            box-shadow: 0 15px 35px rgba(212,175,55,0.5), inset 0 2px 5px rgba(255,255,255,0.4); 
        }

        /* Shine effect on button */
        .btn-phonepe::after {
            content: '';
            position: absolute;
            top: -50%; left: -60%;
            width: 20%; height: 200%;
            background: rgba(255,255,255,0.4);
            transform: rotate(30deg);
            transition: 0.5s;
            opacity: 0;
        }
        .btn-phonepe:hover::after {
            left: 120%;
            opacity: 1;
            transition: left 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .trust-badges {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            font-size: 10px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .trust-badges div {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .payment-methods {
            margin-top: 30px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 30px; 
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .payment-card:hover .payment-methods { opacity: 1; }

    </style>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="https://www.paypal.com/sdk/js?client-id=ASJK-aoiFIIKpTgmRComyW1w0VYUbexsGzzzQnJqZGcKy_6yE3r-Y0tIRXXHTqHH1AVd5IXzFBNtWte4&currency=USD"></script>
</head>
<body>

    <div class="bg-particles"></div>

    <div class="payment-card">
        <a href="membership.html" style="position: absolute; top: 25px; right: 25px; color: #94a3b8; text-decoration: none; font-size: 24px; line-height: 1; transition: color 0.3s; opacity: 0.6; z-index: 10;" onmouseover="this.style.opacity=1; this.style.color='#fff'" onmouseout="this.style.opacity=0.6; this.style.color='#94a3b8'">&times;</a>
        <div class="logo-icon"><span>APD</span></div>

        <div class="discount-badge">✓ Corporate Discount Applied</div>
        
        <h1>Elite Settlement</h1>
        <p class="subtitle">Secure processing for institutional memberships and discounted bulk packages.</p>

        <div class="input-group">
            <label>Registered Entity Name</label>
            <input type="text" id="refName" placeholder="e.g. Reliance Global Imports">
        </div>

        <div class="input-group" style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label>Negotiated Amount</label>
                <input type="number" id="payAmount" placeholder="0.00" style="width: 100%;">
            </div>
            <div style="width: 110px;">
                <label>Currency</label>
                <select id="currencySelect" style="width: 100%; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); padding: 16px 10px; border-radius: 12px; color: white; font-size: 1.1rem; font-weight: 600; outline: none; transition: all 0.3s ease; font-family: 'Inter', sans-serif;" onchange="handleCurrencyChange()">
                    <option value="INR">INR</option>
                    <option value="USD">USD</option>
                </select>
            </div>
        </div>

        
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="btn btn-phonepe" id="payBtn" onclick="initiateCustomPayment()" style="flex: 1; font-size: 14px; padding: 15px 10px;">PhonePe (UPI)</button>
            <button class="btn" id="razorpayBtn" onclick="initiateRazorpayCustomPayment()" style="flex: 1; background: #3399cc; color: white; font-size: 14px; padding: 15px 10px; margin-top: 0;">Razorpay (Cards)</button>
        </div>

        <div id="paypal-button-container" style="margin-top: 15px; display: none;"></div>
        
        <div id="statusMsg" style="font-size: 12px; color: #ef4444; margin-top: 15px; display: none; font-weight: 600;"></div>

        <div class="trust-badges">
            <div>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="#22c55e"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
                256-Bit SSL
            </div>
            <div>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="#d4af37"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm4.24 16L12 15.45 7.77 18l1.12-4.81-3.73-3.23 4.92-.42L12 5l1.92 4.53 4.92.42-3.73 3.23L16.23 18z"/></svg>
                Verified Escrow
            </div>
        </div>

        <div class="payment-methods">
                        <img src="https://razorpay.com/assets/razorpay-logo.svg" alt="Razorpay" height="22" style="filter: grayscale(100%) brightness(200%);">
            <img src="https://upload.wikimedia.org/wikipedia/commons/7/71/PhonePe_Logo.svg" alt="PhonePe" height="22" style="filter: grayscale(100%) brightness(200%);">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b5/PayPal.svg" alt="PayPal" height="18" style="filter: grayscale(100%) brightness(200%);">
        </div>
    </div>

    <script>
        function handleCurrencyChange() {
            const curr = document.getElementById('currencySelect').value;
            const phonepeBtn = document.getElementById('payBtn');
            const paypalContainer = document.getElementById('paypal-button-container');
            
            if (curr === 'USD') {
                phonepeBtn.disabled = true;
                phonepeBtn.style.opacity = '0.5';
                phonepeBtn.title = 'PhonePe only supports INR';
                paypalContainer.style.display = 'block'; // Show PayPal for USD
            } else {
                phonepeBtn.disabled = false;
                phonepeBtn.style.opacity = '1';
                phonepeBtn.title = '';
                paypalContainer.style.display = 'none'; // Hide PayPal for INR
            }
        }

        async function initiateRazorpayCustomPayment() {
            const amount = document.getElementById('payAmount').value;
            const refName = document.getElementById('refName').value;
            const currency = document.getElementById('currencySelect').value;
            const btn = document.getElementById('razorpayBtn');
            const status = document.getElementById('statusMsg');

            if (!amount || amount <= 0) {
                status.innerText = "Error: Please enter a valid negotiated amount.";
                status.style.display = "block";
                return;
            }

            if (!refName) {
                status.innerText = "Error: Please enter your Registered Entity Name.";
                status.style.display = "block";
                return;
            }

            btn.innerText = "Processing...";
            btn.disabled = true;
            status.style.display = "none";

            try {
                const res = await fetch('/api/razorpay-create-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: parseInt(amount), currency: currency })
                });
                const data = await res.json();

                if (!res.ok || !data.id) {
                    throw new Error(data.error || 'Failed to create Razorpay order');
                }

                var options = {
                    "key": data.key_id || "rzp_test_TMQmeVth3hlUux",
                    "amount": data.amount,
                    "currency": data.currency,
                    "name": "APD Global Trade",
                    "description": "Elite Custom: " + refName,
                    "order_id": data.id,
                    "handler": async function (response) {
                        try {
                            const verifyRes = await fetch('/api/razorpay-verify', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    razorpay_order_id: response.razorpay_order_id,
                                    razorpay_payment_id: response.razorpay_payment_id,
                                    razorpay_signature: response.razorpay_signature
                                })
                            });
                            const verifyData = await verifyRes.json();
                            if (verifyData.success) {
                                window.location.href = '/payment-status.html';
                            } else {
                                status.innerText = 'Payment verification failed.';
                                status.style.display = 'block';
                            }
                        } catch(e) {
                            status.innerText = 'Error verifying payment.';
                            status.style.display = 'block';
                        }
                    },
                    "theme": { "color": "#3399cc" }
                };
                var rzp1 = new Razorpay(options);
                rzp1.on('payment.failed', function (response){
                    status.innerText = 'Payment failed: ' + response.error.description;
                    status.style.display = 'block';
                    btn.innerText = 'Razorpay (Cards)';
                    btn.disabled = false;
                });
                rzp1.open();
                
                btn.innerText = 'Razorpay (Cards)';
                btn.disabled = false;
            } catch (err) {
                console.error(err);
                btn.innerText = "Razorpay (Cards)";
                btn.disabled = false;
                status.innerText = err.message;
                status.style.display = "block";
            }
        }

        async function initiateCustomPayment() {
            const amount = document.getElementById('payAmount').value;
            const refName = document.getElementById('refName').value;
            const btn = document.getElementById('payBtn');
            const status = document.getElementById('statusMsg');

            if (!amount || amount <= 0) {
                status.innerText = "Error: Please enter a valid negotiated amount.";
                status.style.display = "block";
                return;
            }

            if (!refName) {
                status.innerText = "Error: Please enter your Registered Entity Name.";
                status.style.display = "block";
                return;
            }

            btn.innerText = "Securing Channel...";
            btn.disabled = true;
            status.style.display = "none";

            try {
                const response = await fetch('/api/phonepe-init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        amount: parseInt(amount),
                        planName: "Elite Custom: " + refName
                    })
                });

                const data = await response.json();

                if (data.success && data.url) {
                    window.location.href = data.url;
                } else {
                    throw new Error(data.error || "Gateway Initialization Failed");
                }
            } catch (err) {
                console.error(err);
                btn.innerText = "Authorize Payment";
                btn.disabled = false;
                status.innerText = err.message;
                status.style.display = "block";
            }
        }

        // Initialize PayPal Buttons
        paypal.Buttons({
            onClick: function(data, actions) {
                const amount = document.getElementById('payAmount').value;
                const refName = document.getElementById('refName').value;
                const currency = document.getElementById('currencySelect').value;
                const status = document.getElementById('statusMsg');

                if (currency !== 'USD') {
                    status.innerText = "Error: PayPal only supports USD. Please select USD from the currency dropdown.";
                    status.style.display = "block";
                    return actions.reject();
                }

                if (!amount || parseFloat(amount) <= 0) {
                    status.innerText = "Error: Please enter a valid negotiated amount.";
                    status.style.display = "block";
                    return actions.reject();
                }

                if (!refName) {
                    status.innerText = "Error: Please enter your Registered Entity Name.";
                    status.style.display = "block";
                    return actions.reject();
                }
                
                status.style.display = "none";
                return actions.resolve();
            },
            createOrder: function (data, actions) {
                const amount = document.getElementById('payAmount').value;
                const refName = document.getElementById('refName').value;
                
                return actions.order.create({
                    purchase_units: [{
                        amount: { value: parseFloat(amount).toString() },
                        description: "Elite Custom: " + refName
                    }]
                });
            },
            onApprove: function (data, actions) {
                return actions.order.capture().then(function (details) {
                    window.location.href = '/payment-status.html';
                });
            },
            onError: function (err) {
                const status = document.getElementById('statusMsg');
                status.innerText = 'PayPal Payment failed or was canceled.';
                status.style.display = 'block';
                console.error(err);
            }
        }).render('#paypal-button-container');
    </script>


<style>
  /* Force Tidio Chat widget to left side so it never covers WhatsApp floating button */
  #tidio-chat, #tidio-chat-iframe, iframe[title="Tidio Chat"], div[id^="tidio-chat"] {
      left: 20px !important;
      right: auto !important;
  }
</style>
<script id="tidio-auto-open">
  document.addEventListener("tidioChat-ready", function() {
      setTimeout(function() {
          try {
              window.tidioChatApi.open();
              const el = document.getElementById("tidio-chat") || document.getElementById("tidio-chat-iframe") || document.querySelector("iframe[title='Tidio Chat']");
              if (el) { el.style.left = "20px"; el.style.right = "auto"; }
          } catch(e){}
      }, 2000);
  });
</script>

<script src="//code.tidio.co/zs195w58z0vrzcknn4gkbosvrnn63xfe.js" async></script>

</body>
</html>
